  <path d="M 8 10.5 L -13 19.6 L -33 19.6 L -31 9.5 Z" fill="url(#wingSG)" stroke="#4A5563" stroke-width="0.6"/>
  <g stroke="#8E9AA8" stroke-width="0.25" fill="none" opacity="0.9">
