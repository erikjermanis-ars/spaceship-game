<?xml version="1.0" encoding="UTF-8"?>
<!-- Scorch / scratch overlay for the courier hull. Same frame as ship_hull.svg.
     Faded in by code as hull integrity drops. Everything stays inside the hull outline. -->
<svg xmlns="http://www.w3.org/2000/svg" width="110" height="64" viewBox="-55 -32 110 64">
  <defs>
    <radialGradient id="scorch" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#120D0A" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#2A1E16" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3A2A1E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="soot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1A1D22" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22262C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB060" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FF5A1F" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF3B1F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- soot washes -->
  <ellipse cx="6" cy="-6" rx="13" ry="5" fill="url(#soot)"/>
  <ellipse cx="-22" cy="5" rx="12" ry="4.5" fill="url(#soot)"/>
  <ellipse cx="-30" cy="-21" rx="10" ry="3" fill="url(#soot)"/>
  <ellipse cx="-24" cy="21" rx="9" ry="3" fill="url(#soot)"/>
  <!-- scorch blooms -->
  <ellipse cx="16" cy="6.5" rx="9.1" ry="5.0" fill="url(#scorch)"/>
  <ellipse cx="-8" cy="-8" rx="7.8" ry="4.2" fill="url(#scorch)"/>
  <ellipse cx="-33" cy="2" rx="6.5" ry="5.6" fill="url(#scorch)"/>
  <ellipse cx="-16" cy="-15" rx="5.9" ry="3.2" fill="url(#scorch)"/>
  <ellipse cx="38" cy="-3" rx="5.2" ry="3.2" fill="url(#scorch)"/>
  <!-- hull breach with glowing edge -->
  <path d="M 13 4.2 L 17.5 3.4 L 20 5.6 L 18.6 8.4 L 14.4 8.8 L 12.2 6.6 Z" fill="#0A0807"/>
  <path d="M 13 4.2 L 17.5 3.4 L 20 5.6 L 18.6 8.4 L 14.4 8.8 L 12.2 6.6 Z" fill="none" stroke="#FF7A2E" stroke-width="0.5" opacity="0.85"/>
  <ellipse cx="16.2" cy="6.1" rx="2.2" ry="1.6" fill="url(#ember)" opacity="0.7"/>
  <!-- scratches -->
  <path d="M 30 -7 L 18 -4.2 M 27 -8 L 14 -5.6 M -2 4 L -15 7.5 M -6 2.6 L -14 4.6 M -36 -20 L -24 -22.4 M -38 20.6 L -27 22.6 M 44 2 L 38 4.4"
        stroke="#4A5260" stroke-width="0.45" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 29.6 -6.6 L 18.2 -3.9 M -2 4.4 L -14.8 7.8" stroke="#FFFFFF" stroke-width="0.25" fill="none" opacity="0.5"/>
  <!-- dents -->
  <path d="M -26 -6 C -24 -7.6 -21 -7.6 -19 -6" stroke="#5B6674" stroke-width="0.5" fill="none"/>
  <path d="M 4 9 C 6 10.2 9 10.2 11 9" stroke="#5B6674" stroke-width="0.5" fill="none"/>
</svg>
