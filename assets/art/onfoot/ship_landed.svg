    <rect x="-27.4" y="27.6" width="7.8" height="2.6" rx="0.9" fill="#3A4452"/>
    <!-- nose gear: twin feet either side of the chin -->
    <path d="M 33 -9 L 34.5 -12.8 L 37.5 -12.8 L 39 -9 Z" fill="#7D8896"/>
    <rect x="33.2" y="-14.2" width="5.6" height="2.2" rx="0.8" fill="#3A4452"/>
    <path d="M 33 9 L 34.5 12.8 L 37.5 12.8 L 39 9 Z" fill="#7D8896"/>
    <rect x="33.2" y="12" width="5.6" height="2.2" rx="0.8" fill="#3A4452"/>
  </g>
