<!-- PETREL light civilian shuttle, top-down, nose toward +X. Same style as ship_hull.svg (WREN).
     1 SVG unit = 1 world pixel = 0.1 m. Origin (0,0) = centre of mass. Starboard = +Y.
     Hull fits the collision polygon (7,0)(5.2,-2.2)(-3.8,-3.6)(-6.6,-2.9) m, mirrored.
     Engines (-66,+-14), tow eye (-10,0), gyro housing (3,0), nav lights (-37,+-34), strobe (-64,0).
     Imported at svg/scale 6. Registration text is drawn in code. -->
