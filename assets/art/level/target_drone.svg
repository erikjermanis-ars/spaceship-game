<?xml version="1.0" encoding="UTF-8"?>
<!-- Gunnery-range target drone, top-down. 1 SVG unit = 1 world pixel = 0.1 m.
     Body radius 24 (the collision circle in target_drone.gd). A pearl shell so
     it stands out against space, carrying a bullseye: amber ring, red centre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-32 -32 64 64">
  <defs>
    <linearGradient id="shell" gradientUnits="userSpaceOnUse" x1="-18" y1="-22" x2="18" y2="22">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E4E9EF"/>
      <stop offset="1" stop-color="#9AA6B4"/>
    </linearGradient>
    <radialGradient id="well" gradientUnits="userSpaceOnUse" cx="-3" cy="-4" r="22">
      <stop offset="0" stop-color="#26426B"/>
      <stop offset="0.7" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0B1526"/>
    </radialGradient>
    <radialGradient id="eye" gradientUnits="userSpaceOnUse" cx="-1.5" cy="-1.5" r="6.5">
      <stop offset="0" stop-color="#FFB0A0"/>
      <stop offset="0.45" stop-color="#FF3B3B"/>
      <stop offset="1" stop-color="#B01818"/>
    </radialGradient>
  </defs>

  <!-- station-keeping thruster blocks on the diagonals -->
  <g fill="#56616E" stroke="#1E242C" stroke-width="0.5">
    <rect x="-3" y="-28.5" width="6" height="6" rx="1" transform="rotate(45)"/>
    <rect x="-3" y="-28.5" width="6" height="6" rx="1" transform="rotate(135)"/>
    <rect x="-3" y="-28.5" width="6" height="6" rx="1" transform="rotate(225)"/>
    <rect x="-3" y="-28.5" width="6" height="6" rx="1" transform="rotate(315)"/>
  </g>
  <g fill="#7FE6FF">
    <rect x="-1.2" y="-29.3" width="2.4" height="1.2" transform="rotate(45)"/>
    <rect x="-1.2" y="-29.3" width="2.4" height="1.2" transform="rotate(135)"/>
    <rect x="-1.2" y="-29.3" width="2.4" height="1.2" transform="rotate(225)"/>
    <rect x="-1.2" y="-29.3" width="2.4" height="1.2" transform="rotate(315)"/>
  </g>

  <!-- shell: octagon -->
  <path d="M 9.2 -22.2 L 22.2 -9.2 L 22.2 9.2 L 9.2 22.2 L -9.2 22.2 L -22.2 9.2 L -22.2 -9.2 L -9.2 -22.2 Z"
        fill="url(#shell)" stroke="#2B3440" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- panel seams to the corners -->
  <path d="M 9.2 -22.2 L 7 -17 M 22.2 -9.2 L 17 -7 M 22.2 9.2 L 17 7 M 9.2 22.2 L 7 17 M -9.2 22.2 L -7 17 M -22.2 9.2 L -17 7 M -22.2 -9.2 L -17 -7 M -9.2 -22.2 L -7 -17"
        stroke="#8E9AA8" stroke-width="0.5"/>
  <!-- lit edge (light from the upper left) -->
  <path d="M -21 8.6 L -21 -8.7 L -8.7 -21 L 8.6 -21" stroke="#FFFFFF" stroke-width="1.2" fill="none" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- target face -->
  <circle r="18.4" fill="url(#well)" stroke="#0B1526" stroke-width="0.8"/>
  <circle r="14.2" fill="none" stroke="#FFB000" stroke-width="4.2"/>
  <circle r="16.3" fill="none" stroke="#FFE08A" stroke-width="0.5" opacity="0.8"/>
  <circle r="8.4" fill="none" stroke="#F4F7FA" stroke-width="2.2"/>
  <circle r="4.6" fill="url(#eye)" stroke="#5C0A0A" stroke-width="0.4"/>
  <!-- range ticks -->
  <path d="M 0 -18 L 0 -10.5 M 18 0 L 10.5 0 M 0 18 L 0 10.5 M -18 0 L -10.5 0" stroke="#0B1526" stroke-width="1.1"/>
  <!-- glass highlight -->
  <path d="M -13.6 -8 C -11 -13 -6 -16 0 -16.4" stroke="#FFFFFF" stroke-width="0.9" fill="none" opacity="0.55" stroke-linecap="round"/>
</svg>
