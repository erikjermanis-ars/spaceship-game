  <path d="M -46 -24.6 L -7 -24.6 C -1.5 -24.6 1.5 -22.6 1.5 -21 C 1.5 -19.4 -1.5 -17.4 -7 -17.4 L -46 -17.4 Z" fill="url(#nacPG)" stroke="#4A5563" stroke-width="0.7"/>
  <path d="M -46 24.6 L -7 24.6 C -1.5 24.6 1.5 22.6 1.5 21 C 1.5 19.4 -1.5 17.4 -7 17.4 L -46 17.4 Z" fill="url(#nacSG)" stroke="#4A5563" stroke-width="0.7"/>
