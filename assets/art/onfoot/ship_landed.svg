<?xml version="1.0" encoding="UTF-8"?>
<!-- "Meridian" class light courier WREN, LANDED, top-down, nose toward +X.
     Same silhouette and units as assets/art/ship/ship_hull.svg (1 unit = 1 world px
     = 0.1 m, origin = centre of mass) but drawn for the on-foot camera (~7.5x zoom):
     landing gear down, panel detail, rivets, vents, open-able port hatch frame,
     cockpit interior under the canopy, sensor gear and service markings.
     Animated parts (hatch door, boarding ramp, lights, engine heat) are drawn in
     code by scripts/onfoot/landed_ship.gd. Imported at svg/scale 12. -->
<svg xmlns="http://www.w3.org/2000/svg" width="116" height="64" viewBox="-58 -32 116 64">
  <defs>
    <linearGradient id="hullG" gradientUnits="userSpaceOnUse" x1="0" y1="-13" x2="0" y2="13">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#EEF2F6"/>
      <stop offset="0.7" stop-color="#DCE3EA"/>
      <stop offset="1" stop-color="#AEB9C6"/>
    </linearGradient>
    <linearGradient id="wingPG" gradientUnits="userSpaceOnUse" x1="0" y1="-20" x2="0" y2="-9">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#D3DBE3"/>
    </linearGradient>
    <linearGradient id="wingSG" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="20">
      <stop offset="0" stop-color="#D3DBE3"/>
      <stop offset="1" stop-color="#B4BFCB"/>
    </linearGradient>
    <linearGradient id="nacPG" gradientUnits="userSpaceOnUse" x1="0" y1="-24.6" x2="0" y2="-17.4">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E4E9EF"/>
      <stop offset="1" stop-color="#A9B4C1"/>
    </linearGradient>
    <linearGradient id="nacSG" gradientUnits="userSpaceOnUse" x1="0" y1="17.4" x2="0" y2="24.6">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="0.55" stop-color="#D5DCE4"/>
      <stop offset="1" stop-color="#9AA6B4"/>
    </linearGradient>
    <radialGradient id="canopyG" gradientUnits="userSpaceOnUse" cx="31" cy="-2" r="11">
      <stop offset="0" stop-color="#5D86AE" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#21395A" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0B1526" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="bellG" gradientUnits="userSpaceOnUse" x1="-51" y1="0" x2="-45" y2="0">
      <stop offset="0" stop-color="#2A313B"/>
      <stop offset="0.5" stop-color="#4E4A6A"/>
      <stop offset="1" stop-color="#5B6674"/>
    </linearGradient>
    <linearGradient id="coilG" gradientUnits="userSpaceOnUse" x1="-40" y1="0" x2="-6" y2="0">
      <stop offset="0" stop-color="#1E6F66"/>
      <stop offset="1" stop-color="#3E8FA8"/>
    </linearGradient>
    <linearGradient id="strutG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA6B4"/>
      <stop offset="1" stop-color="#56616E"/>
    </linearGradient>
    <radialGradient id="seatG" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="3">
      <stop offset="0" stop-color="#3A4A60"/>
      <stop offset="1" stop-color="#1A2433"/>
