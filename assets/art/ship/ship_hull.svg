<?xml version="1.0" encoding="UTF-8"?>
<!-- "Meridian" class light courier, top-down, nose toward +X.
     1 SVG unit = 1 world pixel = 0.1 m. Origin (0,0) = centre of mass.
     Bow RCS quads sit at x=+40 (the 4 m thrust point of the flight model). -->
<svg xmlns="http://www.w3.org/2000/svg" width="110" height="64" viewBox="-55 -32 110 64">
  <defs>
    <linearGradient id="hullG" gradientUnits="userSpaceOnUse" x1="0" y1="-13" x2="0" y2="13">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#EEF2F6"/>
      <stop offset="0.7" stop-color="#DCE3EA"/>
      <stop offset="1" stop-color="#AEB9C6"/>
    </linearGradient>
    <linearGradient id="wingPG" gradientUnits="userSpaceOnUse" x1="0" y1="-20" x2="0" y2="-9">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#D3DBE3"/>
    </linearGradient>
    <linearGradient id="wingSG" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="20">
      <stop offset="0" stop-color="#D3DBE3"/>
      <stop offset="1" stop-color="#B4BFCB"/>
    </linearGradient>
    <linearGradient id="nacPG" gradientUnits="userSpaceOnUse" x1="0" y1="-24.6" x2="0" y2="-17.4">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E4E9EF"/>
      <stop offset="1" stop-color="#A9B4C1"/>
    </linearGradient>
    <linearGradient id="nacSG" gradientUnits="userSpaceOnUse" x1="0" y1="17.4" x2="0" y2="24.6">
      <stop offset="0" stop-color="#F2F5F8"/>
      <stop offset="0.55" stop-color="#D5DCE4"/>
      <stop offset="1" stop-color="#9AA6B4"/>
    </linearGradient>
    <radialGradient id="canopyG" gradientUnits="userSpaceOnUse" cx="31" cy="-2" r="11">
      <stop offset="0" stop-color="#5D86AE"/>
      <stop offset="0.55" stop-color="#21395A"/>
      <stop offset="1" stop-color="#0B1526"/>
    </radialGradient>
    <radialGradient id="warmG" gradientUnits="userSpaceOnUse" cx="23" cy="0" r="5">
      <stop offset="0" stop-color="#FFE2A0" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFC870" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFB060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bellG" gradientUnits="userSpaceOnUse" x1="-51" y1="0" x2="-45" y2="0">
      <stop offset="0" stop-color="#2A313B"/>
      <stop offset="1" stop-color="#5B6674"/>
    </linearGradient>
    <linearGradient id="coilG" gradientUnits="userSpaceOnUse" x1="-40" y1="0" x2="-6" y2="0">
      <stop offset="0" stop-color="#2A9D8F"/>
      <stop offset="1" stop-color="#7FE6FF"/>
    </linearGradient>
  </defs>

  <!-- ===== wings / pylons (behind hull) ===== -->
  <path d="M 8 -10.5 L -13 -19.6 L -33 -19.6 L -31 -9.5 Z" fill="url(#wingPG)" stroke="#4A5563" stroke-width="0.7"/>
  <path d="M 8 10.5 L -13 19.6 L -33 19.6 L -31 9.5 Z" fill="url(#wingSG)" stroke="#4A5563" stroke-width="0.7"/>
  <!-- wing panel lines -->
  <path d="M -3 -13 L -27 -13 M -20 -10 L -22 -19.6 M -9 -11.3 L -11 -18.8" stroke="#8E9AA8" stroke-width="0.35" fill="none" opacity="0.8"/>
  <path d="M -3 13 L -27 13 M -20 10 L -22 19.6 M -9 11.3 L -11 18.8" stroke="#8E9AA8" stroke-width="0.35" fill="none" opacity="0.8"/>
  <!-- navy wing chevrons -->
  <path d="M -4 -14.2 L -14 -18.6 L -19.5 -18.6 L -10.5 -14.2 Z" fill="#1D3557"/>
  <path d="M -4 14.2 L -14 18.6 L -19.5 18.6 L -10.5 14.2 Z" fill="#1D3557"/>
  <path d="M -12.5 -14.2 L -21 -18.6 L -22.6 -18.6 L -14.2 -14.2 Z" fill="#2A9D8F"/>
  <path d="M -12.5 14.2 L -21 18.6 L -22.6 18.6 L -14.2 14.2 Z" fill="#2A9D8F"/>

  <!-- ===== engine bells (aft of nacelles) ===== -->
  <path d="M -45 -23.6 L -51 -24.6 L -51 -17.4 L -45 -18.4 Z" fill="url(#bellG)" stroke="#1E242C" stroke-width="0.4"/>
  <path d="M -45 23.6 L -51 24.6 L -51 17.4 L -45 18.4 Z" fill="url(#bellG)" stroke="#1E242C" stroke-width="0.4"/>
  <rect x="-51.6" y="-23.6" width="1.2" height="5.2" fill="#FF9A4A" opacity="0.85"/>
  <rect x="-51.6" y="18.4" width="1.2" height="5.2" fill="#FF9A4A" opacity="0.85"/>

  <!-- ===== nacelles ===== -->
  <path d="M -46 -24.6 L -7 -24.6 C -1.5 -24.6 1.5 -22.6 1.5 -21 C 1.5 -19.4 -1.5 -17.4 -7 -17.4 L -46 -17.4 Z" fill="url(#nacPG)" stroke="#4A5563" stroke-width="0.8"/>
  <path d="M -46 24.6 L -7 24.6 C -1.5 24.6 1.5 22.6 1.5 21 C 1.5 19.4 -1.5 17.4 -7 17.4 L -46 17.4 Z" fill="url(#nacSG)" stroke="#4A5563" stroke-width="0.8"/>
  <!-- nacelle coil strips (lit by code glow too) -->
  <rect x="-40" y="-22.2" width="33" height="2.4" rx="1.2" fill="#14263F"/>
  <rect x="-39.2" y="-21.7" width="31.4" height="1.4" rx="0.7" fill="url(#coilG)"/>
  <rect x="-40" y="19.8" width="33" height="2.4" rx="1.2" fill="#14263F"/>
  <rect x="-39.2" y="20.3" width="31.4" height="1.4" rx="0.7" fill="url(#coilG)"/>
  <!-- nacelle segment lines -->
  <path d="M -30 -24.6 L -30 -22.3 M -20 -24.6 L -20 -22.3 M -30 -17.4 L -30 -19.7 M -20 -17.4 L -20 -19.7 M -43 -24.6 L -43 -17.4" stroke="#8E9AA8" stroke-width="0.35"/>
  <path d="M -30 24.6 L -30 22.3 M -20 24.6 L -20 22.3 M -30 17.4 L -30 19.7 M -20 17.4 L -20 19.7 M -43 24.6 L -43 17.4" stroke="#8E9AA8" stroke-width="0.35"/>
  <!-- intake caps -->
  <path d="M -2 -24 C 1 -23.4 1.4 -21.8 1.4 -21 C 1.4 -20.2 1 -18.6 -2 -18 Z" fill="#7FE6FF"/>
  <path d="M -2 24 C 1 23.4 1.4 21.8 1.4 21 C 1.4 20.2 1 18.6 -2 18 Z" fill="#7FE6FF"/>
  <!-- nav light housings on outboard nacelle flanks -->
  <circle cx="-9" cy="-24.9" r="1.1" fill="#FF3B3B"/>
  <circle cx="-9" cy="24.9" r="1.1" fill="#3BFF7A"/>

  <!-- ===== main hull ===== -->
  <path d="M 50 0 C 49 -3.6 44.5 -7.2 35 -9.6 C 23 -12.2 6 -12.6 -10 -11.6 L -34 -8.8 C -39.5 -8.1 -42.5 -5.2 -42.5 0 C -42.5 5.2 -39.5 8.1 -34 8.8 L -10 11.6 C 6 12.6 23 12.2 35 9.6 C 44.5 7.2 49 3.6 50 0 Z"
        fill="url(#hullG)" stroke="#4A5563" stroke-width="0.9"/>
  <!-- stern engineering block -->
  <path d="M -26 -9.6 L -34 -8.8 C -39.5 -8.1 -42.5 -5.2 -42.5 0 C -42.5 5.2 -39.5 8.1 -34 8.8 L -26 9.6 Z" fill="#CBD3DC" stroke="#8E9AA8" stroke-width="0.4"/>
  <path d="M -29 -6 L -39 -5 M -29 -3 L -40 -2.5 M -29 3 L -40 2.5 M -29 6 L -39 5" stroke="#9AA6B4" stroke-width="0.5"/>
  <!-- gloss highlight along the lit (port / top) flank -->
  <path d="M 46 -2.6 C 42 -6 34 -8.4 24 -9.8 C 12 -11.1 -4 -11.2 -20 -10" stroke="#FFFFFF" stroke-width="1.1" fill="none" opacity="0.75" stroke-linecap="round"/>

  <!-- navy cheek swooshes -->
  <path d="M 36 -9 C 22 -11.6 2 -12 -24 -10.2 L -24 -8.6 C 2 -10.2 20 -9.8 31 -7.4 Z" fill="#1D3557"/>
  <path d="M 36 9 C 22 11.6 2 12 -24 10.2 L -24 8.6 C 2 10.2 20 9.8 31 7.4 Z" fill="#1D3557"/>
  <path d="M 29 -6.8 C 18 -8.6 2 -9 -24 -7.7" stroke="#2A9D8F" stroke-width="0.7" fill="none"/>
  <path d="M 29 6.8 C 18 8.6 2 9 -24 7.7" stroke="#2A9D8F" stroke-width="0.7" fill="none"/>

  <!-- spine stripe -->
  <path d="M 17 -1.5 L -41 -2.3 L -41 2.3 L 17 1.5 Z" fill="#1D3557"/>
  <path d="M 15 -0.35 L -40 -0.5 L -40 0.5 L 15 0.35 Z" fill="#2A9D8F"/>

  <!-- panel lines -->
  <path d="M 12 -11.9 C 13 -6 13 6 12 11.9 M -4 -11.9 C -3.4 -6 -3.4 6 -4 11.9 M -18 -10.4 L -18 -2.1 M -18 2.1 L -18 10.4" stroke="#8E9AA8" stroke-width="0.4" fill="none" opacity="0.9"/>
  <path d="M 4 -5 L 10 -5 L 10 -3.5 L 4 -3.5 Z M 4 3.5 L 10 3.5 L 10 5 L 4 5 Z" fill="#AAB5C1"/>
  <path d="M -12 -6.5 L -6 -6.5 M -12 -5.4 L -6 -5.4 M -12 5.4 L -6 5.4 M -12 6.5 L -6 6.5" stroke="#8E9AA8" stroke-width="0.4"/>

  <!-- ===== cockpit canopy ===== -->
  <path d="M 40 0 C 39 -3.7 34 -5.4 27 -5.4 C 21.5 -5.4 19 -3.2 19 0 C 19 3.2 21.5 5.4 27 5.4 C 34 5.4 39 3.7 40 0 Z" fill="url(#canopyG)" stroke="#1D3557" stroke-width="0.9"/>
  <ellipse cx="23.5" cy="0" rx="4.6" ry="4" fill="url(#warmG)"/>
  <path d="M 30.5 -5.2 L 30.5 5.2" stroke="#1D3557" stroke-width="0.6"/>
  <path d="M 37 -2.2 C 35 -4 31 -4.6 27 -4.4" stroke="#CFEFFF" stroke-width="0.7" fill="none" opacity="0.8" stroke-linecap="round"/>

  <!-- ===== bow RCS quads (thrust point, x = +40) ===== -->
  <rect x="38.4" y="-8.3" width="4.4" height="2.8" rx="0.5" fill="#9AA6B4" stroke="#56616E" stroke-width="0.35"/>
  <rect x="38.4" y="5.5" width="4.4" height="2.8" rx="0.5" fill="#9AA6B4" stroke="#56616E" stroke-width="0.35"/>
  <rect x="39.7" y="-9.1" width="1.8" height="0.9" fill="#2B3440"/>
  <rect x="39.7" y="8.2" width="1.8" height="0.9" fill="#2B3440"/>
  <rect x="42.6" y="-7.6" width="0.8" height="1.4" fill="#2B3440"/>
  <rect x="42.6" y="6.2" width="0.8" height="1.4" fill="#2B3440"/>
  <rect x="38.0" y="-7.6" width="0.6" height="1.4" fill="#2B3440"/>
  <rect x="38.0" y="6.2" width="0.6" height="1.4" fill="#2B3440"/>
  <!-- ===== stern RCS (strafe) ===== -->
  <rect x="-37.8" y="-10" width="3.6" height="2.4" rx="0.4" fill="#9AA6B4" stroke="#56616E" stroke-width="0.35"/>
  <rect x="-37.8" y="7.6" width="3.6" height="2.4" rx="0.4" fill="#9AA6B4" stroke="#56616E" stroke-width="0.35"/>
  <rect x="-36.8" y="-10.7" width="1.6" height="0.8" fill="#2B3440"/>
  <rect x="-36.8" y="9.9" width="1.6" height="0.8" fill="#2B3440"/>
  <!-- strobe housing -->
  <circle cx="-42.6" cy="0" r="1.0" fill="#F4F7FA" stroke="#56616E" stroke-width="0.3"/>
</svg>
